# ============================================================
# Keep Grinding and Nobody Dies - Oyun Ayarlari
# ============================================================
# Bu dosyayi diledigin gibi degistirebilirsin. Rust tarafinda hicbir
# sabit deger kalmadi - hepsi buradan okunuyor.
#
# ONEMLI: Degisiklik yaptiktan sonra kaydet ve uygulamayi (pnpm tauri dev)
# YENIDEN BASLAT. Uygulama calisirken bu dosyayi otomatik yeniden okumaz,
# sadece baslangicta bir kere okur.
#
# Bir satiri bozarsan (yanlis TOML formati) uygulama cokmez, sadece o
# ayarlarin hepsini yok sayip varsayilan degerlere doner ve terminale
# bir uyari yazar.


[game]
# Bombanin toplam geri sayim suresi (milisaniye). 240000 = 4 dakika.
# Oyunu kolaylastirmak icin buyut, zorlastirmak icin kucult.
# NOT: Bombanin fiziksel 3 haneli ekrani sureyi D:SS formatinda gosterir
# (orn. 4:00 -> "400"). 9:59'dan (599000 ms) uzun sureler ekranda geri
# sayim 9:59'un altina inene kadar "959" olarak gorunur - tablet dogru
# sureyi gostermeye devam eder.
total_time_ms = 240000

# Bomba patlamadan once kac hataya izin verildigi. Son haktan once yapilan
# her yanlis asagidaki first_mistake_penalty_ms kadar sureyi siler; son hak
# da (orn. attempts=5 ise 5. yanlis) bombayi direkt patlatir.
attempts = 5

# Bir yanlis yapildiginda geri sayim suresinden dusulen ceza (milisaniye).
# 20000 = 20 saniye. Yukaridaki attempts sayisina ulasan yanlis her zaman
# oyunu direkt bitirir (bomba patlar), ceza uygulanmadan.
first_mistake_penalty_ms = 20000

# "The Button" (Dugme) modulunde, dugmeye basip birakma arasindaki sure
# bu degerin ALTINDAYSA "tap" (hizli basip birakma), ustundeyse "hold"
# (basili tutma) sayilir. Milisaniye cinsinden.
hold_threshold_ms = 600

# Bir modulun ICINDE hata yapilinca o ana kadarki ilerlemeye ne olacagi.
# (Hak kaybi ve sure cezasi HER DURUMDA uygulanir - burasi sadece modul
# ici ilerlemeyi belirler.) Asamali moduller icin gecerlidir: Memory ve
# Simon Says.
#
#   "advance"        = VARSAYILAN. Yanlis yapilan asama da gecilmis
#                      sayilir, oyun bir sonraki asamadan devam eder.
#                      Hicbir sey bastan yapilmaz - grup bir modulde
#                      sonsuza kadar takilip kalamaz.
#   "retry_stage"    = Onceki asamalar korunur, sadece hata yapilan asama
#                      yeniden oynanir.
#   "restart_module" = Eski (en zor) davranis: modul komple sifirlanir,
#                      tum ilerleme silinir.
#
# NOT: Simon Says'de her hata, renk -> dugme esleme tablosunun SATIRINI da
# degistirir (uzmanin kilavuzundaki "Strikes" sutunu). Yani ilerleme
# korunsa bile diziyi yeni satira gore tekrar okumak gerekir.
mistake_behavior = "advance"

# Simon Says modulunun kac asamaya kadar buyuyecegi (sira ne kadar uzayacak).
# Varsayilan 5. Daha yuksek bir sayi verirsen (orn. 8) modul daha uzun ve
# zor olur - dizi sinirsiz buyuyebiliyor, coksmeyeceginden emin olabilirsin.
simon_stages = 5


[events]
# Iki sabotaj olayi ARASINDAKI SESSIZ SURE (milisaniye).
#
# ONEMLI: Bu sure, bir onceki olay BITTIKTEN sonra baslar (basladigi andan
# degil). Yani olayin kendi suresi bu bekleme suresini yemez - 45000
# yazarsan olaylar arasinda gercekten ~45 saniye sakinlik olur.
#
# KUCULTURSEN olaylar DAHA SIK gelir (daha kaotik).
# BUYUTURSEN olaylar DAHA SEYREK gelir (daha sakin).
#
# Kaba hesap: 4 dakikalik bir oyunda 45000 ile ~4 olay gorursun.
# Cok fazla geliyorsa 60000-90000 yap; daha kaotik istiyorsan 20000-30000.
#
# Not: sure dolsa bile olay kritik bir anda baslamaz (orn. Simon Says
# diziyi oynatirken veya dugme basili tutulurken) - uygun ilk ana kadar
# bekler.
interval_ms = 45000

# Yukaridaki sureye eklenen/cikarilan RASTGELELIK (milisaniye).
# 15000 ise bekleme suresi 30-60 saniye arasinda degisir; boylece olaylar
# saat gibi duzenli gelmez, tahmin edilemez olur.
# 0 yazarsan sure her seferinde tam olarak interval_ms olur.
interval_jitter_ms = 15000

[events.duration_ms]
# Her sabotaj olayinin ekranda ne kadar sure (milisaniye) kalacagi.
# Buyuk deger = olay daha uzun surer, oyuncuyu daha cok ugrastirir.

# Yazilar/harfler karisir, okumasi zorlasir.
dyslexia = 9000
# Ekran 180 derece ters doner.
upside_down = 7000
# Sahte "mavi ekran" (sistem hatasi) simulasyonu, ekranin cogunu kaplar.
blue_screen = 9000
# Ekran sallanir/titrer, "saldiri tespit edildi" banner'i gorunur.
turk_attack = 11000
# Urkutucu video/canavar yuzu belirir (asagidaki [events.jumpscare] ile
# kendi videolarini ekleyebilirsin).
jumpscare = 3500
# Ekran aynalanir (sag-sol ters doner).
mirror_mode = 10000
# Eski TV parazit efekti + "SIGNAL LOST" yazisi.
static_glitch = 5000
# Kirmizi/mavi alarm isiklari yanip soner (polis isigi gibi).
siren_lights = 10000

[stimulation]
# "Stimulasyon kosesi": tablet ekraninin sag alt kosesinde, oyun surerken
# SESSIZ ve dongude oynayan kisa video klipleri (orn. kendi indirdigin
# subway surfers / oyun videosu kayitlari). Birden fazla klip eklersen
# TikTok gibi 12 saniyede bir otomatik olarak sonrakine "kaydirilir".
#
# Yol formati jumpscare'dekiyle ayni: bilgisayarindaki tam dosya yolu,
# ters slash'lar CIFT yazilir:
#   "C:\\Users\\Lenovo\\Videos\\subway1.mp4"
#
# Bos liste ([]) = kose hic gorunmez. Videolar her zaman sessizdir ve
# dokunuslari engellemez (bombanin ustune tiklamayi bozamaz).
#
# Ornek:
# video_paths = [
#   "C:\\Users\\Lenovo\\Videos\\subway1.mp4",
#   "C:\\Users\\Lenovo\\Videos\\minecraft-parkour.mp4",
# ]
video_paths = []

[events.jumpscare]
# Jumpscare olayi tetiklendiginde EKRANDA OYNATILACAK video dosyalarinin
# yollari. En fazla 3 tane ekleyebilirsin - olay her tetiklendiginde
# bunlardan biri RASTGELE secilip tam ekran oynatilir.
#
# Yol formati: bilgisayarindaki tam dosya yolu, orn:
#   "C:\\Users\\Lenovo\\Videos\\korkunc1.mp4"
# (Windows yollarinda ters slash'i CIFT yazmayi unutma: \\ )
#
# Bos birakirsan (asagidaki gibi []), eski canavar-yuzu CSS efekti +
# sentezlenmis korku sesi otomatik olarak devreye girer - hicbir sey
# kirilmaz, video eklemek tamamen istege bagli.
#
# Ornek (kendi videolarini eklemek icin basindaki # isaretini kaldirip
# kendi yollarinla degistir):
# video_paths = [
#   "C:\\Users\\Lenovo\\Videos\\jumpscare1.mp4",
#   "C:\\Users\\Lenovo\\Videos\\jumpscare2.mp4",
#   "C:\\Users\\Lenovo\\Videos\\jumpscare3.mp4",
# ]
video_paths = []
